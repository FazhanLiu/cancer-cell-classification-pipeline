run_name: resnet18
seed: 42
dataset:
  root: E:\cancer_cell_classification\histopathologic-cancer-detection
  image_size: 224
  val_size: 0.15
  test_size: 0.15
  num_workers: 4
model:
  name: resnet18
  pretrained: true
  num_classes: 2
train:
  epochs: 20
  batch_size: 32
  grad_accum_steps: 1
  lr: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.05
  amp: true
  early_stopping_patience: 5
  class_weight: true
output_dir: outputs

