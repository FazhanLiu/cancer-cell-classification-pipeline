run_name: vit_small
seed: 42
dataset:
  root: data/histopathologic-cancer-detection
  image_size: 224
  val_size: 0.15
  test_size: 0.15
  num_workers: 0
model:
  name: vit_small_patch16_224
  pretrained: true
  num_classes: 2
train:
  epochs: 60
  batch_size: 8
  grad_accum_steps: 4
  lr: 0.00005
  weight_decay: 0.05
  label_smoothing: 0.1
  amp: true
  early_stopping_patience: 10
  class_weight: true
output_dir: outputs
device: auto
deterministic: true
