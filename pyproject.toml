[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-cell-classification-pipeline"
version = "0.2.0"
description = "Reproducible patch-level classification and post-hoc explanation experiments"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "Pillow>=11,<12", "PyYAML>=6,<7",
  "scikit-learn>=1.6,<1.8", "matplotlib>=3.10,<4", "timm>=1.0.15,<1.1",
  "torch>=2.7,<2.8", "torchvision>=0.22,<0.23", "tqdm>=4.67,<5",
  "python-dotenv>=1.0.1,<2", "Flask>=3.1,<4"
]

[project.optional-dependencies]
test = ["pytest>=8.3.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.package-data]
cancer_pipeline = ["web/templates/*.html", "web/assets/*"]
